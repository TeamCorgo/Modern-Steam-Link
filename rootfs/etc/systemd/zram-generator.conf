# zram (compressed swap in RAM) is off: with no [zram0] section here,
# systemd-zram-generator creates no zram device. To turn it on, add:
#
#   [zram0]
#   zram-size = ram / 2
#   compression-algorithm = zstd
#   swap-priority = 100
#
# then run: sudo systemctl daemon-reload && sudo systemctl start systemd-zram-setup@zram0
